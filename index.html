<style>
:root{--hd-bg:#ffffff;--hd-ink:#0b4fb3;--hd-sub:#4a6fa8;--blue:#1473e6;--blue-d:#0b5cc4;--gold:#f5c400;--bg:#f3f8ff;--card:#fff;--ink:#14213d;--mute:#64708a;--line:#d6e6fb;--warn:#fff4d6;--warn-l:#f3d78a;--c1:#dcecff;--c2:#dcf5ea;--c3:#fff0d6;--c4:#e8e4ff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:84px}
header{position:relative;overflow:hidden;background:var(--hd-bg);color:var(--hd-ink);padding:20px 16px 22px;border-bottom:5px solid var(--gold);box-shadow:0 2px 12px rgba(20,115,230,.15)}
header::before{content:"";position:absolute;inset:0;background:var(--hd-img,none) right -10px center/auto 125% no-repeat;opacity:.13;pointer-events:none}
header.photo::before{background-size:cover;background-position:center;opacity:.28}
header.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.93) 0%,rgba(255,255,255,.7) 55%,rgba(255,255,255,.25) 100%);pointer-events:none}
.hw{position:relative;z-index:1;max-width:760px;margin:0 auto}
.hd{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center}
#logo{height:64px;width:auto;max-width:62px;object-fit:contain;flex:none}
#logo[hidden]{display:none}
header small{display:block;font-weight:700;font-size:min(.74rem,calc((100vw - 40px)/31));white-space:nowrap;line-height:1.3;color:var(--hd-sub);letter-spacing:.02em}
.hd:has(#logo:not([hidden])) small{font-size:min(.74rem,calc((100vw - 118px)/31))}
netlify-drawer,#netlify-drawer,[data-netlify-deploy-id]>iframe,iframe[src*="netlify-drawer"],iframe[title*="Netlify"]{display:none!important}
header h1{margin:12px 0 0;font-size:min(calc((100vw - 32px)/19),2.8rem);white-space:nowrap;line-height:1.1;font-weight:800;color:var(--hd-ink);text-transform:uppercase;letter-spacing:-.01em;text-shadow:0 1px 0 rgba(255,255,255,.9)}
header h1::after{content:"";display:block;width:72px;height:6px;background:var(--gold);border-radius:4px;margin-top:10px}
header p{display:none}
main{max-width:760px;margin:0 auto;padding:14px;position:relative;z-index:1}
body::before{content:"";position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));height:min(100vw,68vh);background:var(--bg-img,none) center bottom/contain no-repeat;opacity:.17;pointer-events:none;z-index:0}
.item{background:rgba(255,255,255,.93)}
.note{background:var(--warn);border:1px solid var(--warn-l);border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tile{background:#d3e6ff;border:1px solid #a9cdf8;border-radius:16px;padding:16px;text-decoration:none;color:var(--ink);display:block}
.tile .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:1.5rem;background:#fff}
.tile b{display:block;font-size:1.02rem;margin:10px 0 2px;font-weight:700;line-height:1.3}
.tile span.s{color:#37598f;font-size:.84rem}
.hero{grid-column:1/-1}
.duo{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.duo .hero{grid-column:auto;display:flex;flex-direction:column}
.duo .hero b{margin-top:auto;padding-top:10px}
.cal{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px 10px 14px;background:linear-gradient(160deg,#fff8c9 0%,#ffe27a 55%,#ffc43d 100%);border:2px solid #ffa700;box-shadow:0 6px 16px rgba(255,167,0,.28);overflow:hidden}
.cal::before{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.45);pointer-events:none}
.cal>*{position:relative}
.cal .ct{font-size:.7rem;font-weight:800;letter-spacing:.05em;color:#8a4300;text-transform:uppercase;line-height:1.3}
.cal .box{width:100%;max-width:130px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 3px 8px rgba(138,67,0,.22)}
.cal .m{background:linear-gradient(90deg,#ff6a00,#ff9100);color:#fff;font-weight:800;font-size:.76rem;letter-spacing:.08em;padding:4px 0}
.cal .d{font-size:2.9rem;font-weight:800;line-height:1.05;color:#d94a00;padding-top:4px}
.cal .w{font-size:.82rem;font-weight:700;color:#7a4a1a;padding:0 0 7px}
.cal .info{font-size:.78rem;color:#5c3500;line-height:1.4;font-weight:600}
.cal .info span{display:block}
.cal .badge2{display:inline-block;font-size:.76rem;font-weight:800;color:#fff;background:#ff7a00;border-radius:999px;padding:4px 12px;margin-top:auto}
.cal.soon .badge2{background:#e53935;animation:calpulse 1.6s ease-in-out infinite}
.cal.today .badge2{background:#1f9d55;animation:calpulse 1.2s ease-in-out infinite}
.cal.past{background:linear-gradient(160deg,#f6f6f4,#e6e6e1);border-color:#c9c9c2;box-shadow:none}
.cal.past .d{color:#7b7b75}.cal.past .m{background:#8d8d86}.cal.past .ct,.cal.past .info{color:#6c6c66}.cal.past .badge2{background:#8d8d86}
.cal .more{font-size:.72rem;font-weight:700;color:#8a4300;text-decoration:underline}
@keyframes calpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(229,57,53,.45)}50%{transform:scale(1.06);box-shadow:0 0 0 7px rgba(229,57,53,0)}}
@media (prefers-reduced-motion:reduce){.cal .badge2{animation:none!important}}
.reg{grid-column:1/-1;border:2px solid #7ccf9a;background:#e6f7ec}
.reg b{color:#14703a}
.reg span.s{color:#2f6b47}
.reg .btn{background:#1f9d55}
.reg .btn.alt{background:#fff;color:#1f9d55;border:1px solid #1f9d55}
.reg .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.reg .btn{margin-top:0;text-align:center;padding:10px 6px;font-size:.8rem;line-height:1.3;display:flex;align-items:center;justify-content:center}
h2{font-size:1.25rem;margin:4px 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input[type=search],input[type=text]{width:100%;flex:1 1 100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.item h3{margin:0 0 4px;font-size:1.02rem}
.item .meta{color:var(--mute);font-size:.85rem}
.item p{margin:8px 0 0;font-size:.92rem}
.badge{display:inline-block;background:#dcecff;color:#0b4fb3;font-weight:700;font-size:.75rem;padding:2px 10px;border-radius:99px;margin-bottom:6px}
.btn{display:inline-block;margin-top:10px;background:var(--blue);color:#fff;text-decoration:none;padding:8px 16px;border-radius:10px;font-weight:600;font-size:.88rem;border:0;font-family:inherit;cursor:pointer}
.btn.alt{background:var(--card);color:var(--blue);border:1px solid var(--blue)}
.btn:hover{background:var(--blue-d);color:#fff}
.empty{text-align:center;color:var(--mute);padding:32px 12px}
footer{text-align:center;margin:22px 0 4px;font-size:.8rem;color:var(--mute)}
footer a{color:var(--mute)}
.contact{grid-column:1/-1;background:#fbe9e9;border:2px solid #b5474a}
.contact .ct{display:flex;align-items:center;gap:12px}
.contact .ic{background:#8b1a1a;color:#fff;flex:none}
.contact b{margin:0;color:#7a1414;font-size:.95rem;letter-spacing:.04em}
.contact .row{display:grid;gap:8px;margin-top:12px}
.contact .btn{margin-top:0;text-align:center;padding:10px 12px;font-size:.85rem;line-height:1.3;background:#8b1a1a}
.contact .btn.alt{background:#fff;color:#8b1a1a;border:1px solid #8b1a1a}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{flex:1;min-width:0;line-height:1.2;text-align:center;text-decoration:none;color:var(--mute);font-size:.66rem;font-weight:600;padding:4px 0}
nav a span{display:block;font-size:1.25rem}
nav a[aria-current=page]{color:var(--blue)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.pl{white-space:pre-line;overflow-wrap:anywhere}
.badge.new{background:#fde2e0;color:#b3261e}
details{margin-top:8px}details summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:.9rem;padding:4px 0}
ol.st{padding-left:20px;margin:8px 0 0;font-size:.92rem}
</style>
</head>

 policies:[{"nhom": "Học nghề", "doi_tuong": "Thanh niên hoàn thành nghĩa vụ quân sự hoặc nghĩa vụ tham gia Công an nhân dân; thanh niên tình nguyện hoàn thành nhiệm vụ thực hiện chương trình, dự án phát triển kinh tế - xã hội; trí thức trẻ tình nguyện hoàn thành nhiệm vụ công tác tại khu kinh tế - quốc phòng.", "noi_dung": "• Hỗ trợ đào tạo trình độ sơ cấp, đào tạo dưới 03 tháng\n• Học phí theo mức thu thực tế của cơ sở đào tạo\n• Tiền ăn, sinh hoạt phí: 50.000 đồng/người/ngày trong thời gian học\n• Tiền đi lại: 200.000 đồng/người/khóa (ở cách nơi học từ 15 km); 300.000 đồng/người/khóa (ở địa bàn đặc biệt khó khăn, cách từ 5 km)\n• Tổng các khoản hỗ trợ không quá 12 tháng mức lương cơ sở\n• Địa phương có thể quyết định mức cao hơn khi điều kiện cho phép", "dieu_kien": "• Có nhu cầu đào tạo trong 60 tháng kể từ ngày hoàn thành nghĩa vụ hoặc nhiệm vụ\n• Chưa được ngân sách nhà nước hỗ trợ đào tạo nghề kể từ ngày hoàn thành nghĩa vụ hoặc nhiệm vụ\n• Chỉ được hỗ trợ một lần theo chính sách này", "ho_so": "• Giấy đề nghị hỗ trợ đào tạo nghề (Mẫu số 01 Phụ lục I, Nghị định 338/2025/NĐ-CP)\n• Giấy tờ chứng minh đối tượng (quyết định xuất ngũ, giấy chứng nhận tham gia tình nguyện…)\n• Chứng chỉ sơ cấp hoặc chứng nhận hoàn thành khóa học\n• Hóa đơn hoặc biên lai thu tiền đào tạo", "noi_nop": "Nộp tại UBND cấp xã nơi ở hiện tại: trực tiếp, qua bưu chính công ích, Trung tâm Phục vụ hành chính công hoặc trực tuyến trên Cổng Dịch vụ công quốc gia. UBND cấp xã quyết định trong 07 ngày làm việc kể từ khi nhận đủ hồ sơ.", "can_cu": "Luật Việc làm 74/2025/QH15 (Điều 12); Nghị định 338/2025/NĐ-CP (Điều 25 đến 29)", "link": "", "tieu_de": "Hỗ trợ đào tạo nghề cho thanh niên"}, {"nhom": "Vay vốn", "doi_tuong": "Người lao động (trong đó có thanh niên) có năng lực hành vi dân sự đầy đủ và có phương án sử dụng vốn vay để tạo việc làm, duy trì, mở rộng việc làm.", "noi_dung": "• Vay qua Ngân hàng Chính sách xã hội\n• Mức vay tối đa 200 triệu đồng/người lao động (địa phương có thể quyết định mức cao hơn với nguồn vốn ngân sách địa phương ủy thác)\n• Thời hạn vay tối đa 120 tháng; thời hạn cụ thể do ngân hàng và người vay thỏa thuận\n• Lãi suất bằng 127% lãi suất vay vốn đối với hộ nghèo từng thời kỳ; một số đối tượng ưu tiên (như người dân tộc thiểu số thuộc hộ nghèo, người khuyết tật) vay với lãi suất bằng lãi suất hộ nghèo\n• Lãi suất nợ quá hạn bằng 130% lãi suất vay vốn", "dieu_kien": "• Có năng lực hành vi dân sự đầy đủ\n• Có phương án sử dụng vốn vay để tạo việc làm, duy trì, mở rộng việc làm\n• Mức vay cụ thể do ngân hàng thỏa thuận với người vay, căn cứ nguồn vốn và khả năng trả nợ", "ho_so": "• Phương án sử dụng vốn vay theo mẫu của Ngân hàng Chính sách xã hội\n• Giấy tờ chứng minh đối tượng được vay lãi suất thấp hơn (nếu có), như giấy xác nhận khuyết tật, giấy tờ chứng minh dân tộc, hộ nghèo", "noi_nop": "Nộp hồ sơ tại Ngân hàng Chính sách xã hội. Ngân hàng thông báo kết quả phê duyệt trong 07 ngày làm việc kể từ khi nhận đủ hồ sơ.", "can_cu": "Luật Việc làm 74/2025/QH15 (Điều 8, 9, 12); Nghị định 338/2025/NĐ-CP (Điều 5 đến 11)", "link": "", "tieu_de": "Vay vốn hỗ trợ tạo việc làm, duy trì và mở rộng việc làm"}, {"nhom": "Đi làm việc ở nước ngoài", "doi_tuong": "Người lao động thuộc diện được hỗ trợ, trong đó có thanh niên hoàn thành nghĩa vụ quân sự hoặc nghĩa vụ tham gia Công an nhân dân, thanh niên tình nguyện, trí thức trẻ tình nguyện; ngoài ra có người có công và thân nhân, người dân tộc thiểu số, người thuộc hộ nghèo, hộ cận nghèo, người có đất thu hồi.", "noi_dung": "• Giáo dục định hướng: hỗ trợ chi phí đào tạo theo thực tế, tối đa 530.000 đồng/người/khóa; tiền ăn 50.000 đồng/ngày; tiền ở 400.000 đồng/tháng; tiền đi lại 200.000 hoặc 300.000 đồng/khóa tùy khoảng cách và địa bàn\n• Đào tạo nâng cao tay nghề: tối đa 4 triệu đồng/người/khóa\n• Đào tạo ngoại ngữ: tối đa 4 triệu đồng/người/khóa\n• Chi phí khác: lệ phí làm hộ chiếu, lệ phí phiếu lý lịch tư pháp, lệ phí thị thực (visa)\n• Khám sức khỏe: theo giá thực tế, tối đa 750.000 đồng/người", "dieu_kien": "• Thuộc một trong các đối tượng được hỗ trợ\n• Chưa được hỗ trợ đi làm việc ở nước ngoài theo chính sách khác của Nhà nước\n• Người thuộc nhiều diện được chọn diện có lợi nhất và chỉ hưởng một lần", "ho_so": "• Giấy đề nghị hỗ trợ (Mẫu số 02 Phụ lục I, Nghị định 338/2025/NĐ-CP)\n• Giấy tờ chứng minh đối tượng (quyết định xuất ngũ, giấy tờ dân tộc, hộ nghèo/cận nghèo, quyết định thu hồi đất…)\n• Bản sao hợp đồng đưa người lao động đi làm việc ở nước ngoài\n• Bản sao hộ chiếu còn thời hạn và thị thực\n• Hóa đơn hoặc biên lai thu tiền khám sức khỏe, hộ chiếu, thị thực, lý lịch tư pháp, đào tạo", "noi_nop": "Người lao động có nơi ở tại Quảng Trị nộp hồ sơ tại UBND xã, phường, đặc khu nơi ở hiện tại theo Quyết định của UBND tỉnh Quảng Trị (hiệu lực 20/10/2026). Có thể nộp trực tiếp, qua bưu chính công ích, Trung tâm Phục vụ hành chính công hoặc trực tuyến trên Cổng Dịch vụ công quốc gia. Cơ quan quyết định hỗ trợ trong 07 ngày làm việc kể từ khi nhận đủ hồ sơ.", "can_cu": "Luật Việc làm 74/2025/QH15 (Điều 14); Nghị định 338/2025/NĐ-CP (Điều 4, 30 đến 33); Quyết định của UBND tỉnh Quảng Trị (hiệu lực 20/10/2026)", "link": "", "tieu_de": "Hỗ trợ chi phí đi làm việc ở nước ngoài theo hợp đồng"}, {"nhom": "Đi làm việc ở nước ngoài", "doi_tuong": "Người lao động có năng lực hành vi dân sự đầy đủ, đã ký hợp đồng với doanh nghiệp dịch vụ hoặc đơn vị sự nghiệp đưa người lao động đi làm việc ở nước ngoài theo hợp đồng.", "noi_dung": "• Mức vay tối đa bằng 100% tổng chi phí người lao động phải trả trước khi đi (không gồm các khoản Nhà nước đã hỗ trợ)\n• Thời hạn vay tối đa bằng thời hạn hợp đồng đi làm việc ở nước ngoài, không tính thời gian gia hạn\n• Lãi suất bằng 127% lãi suất vay vốn hộ nghèo; người dân tộc thiểu số thuộc hộ nghèo và một số đối tượng ưu tiên vay với lãi suất bằng lãi suất hộ nghèo\n• Mức vay cụ thể do ngân hàng thỏa thuận với người vay", "dieu_kien": "• Có năng lực hành vi dân sự đầy đủ\n• Đã ký hợp đồng đi làm việc ở nước ngoài với doanh nghiệp dịch vụ hoặc đơn vị sự nghiệp theo quy định\n• Thực hiện bảo đảm tiền vay theo quy định (mức vay trên 200 triệu đồng phải có bảo đảm)", "ho_so": "• Giấy đề nghị vay vốn theo mẫu của Ngân hàng Chính sách xã hội\n• Giấy tờ chứng minh đối tượng được vay lãi suất thấp hơn (nếu có)\n• Bản sao hợp đồng đưa người lao động đi làm việc ở nước ngoài\n• Bản sao hộ chiếu còn thời hạn\n• Giấy tờ về tài sản bảo đảm nếu vay trên 200 triệu đồng", "noi_nop": "Nộp hồ sơ tại Ngân hàng Chính sách xã hội. Ngân hàng thông báo kết quả phê duyệt trong 07 ngày làm việc kể từ khi nhận đủ hồ sơ.", "can_cu": "Luật Việc làm 74/2025/QH15 (Điều 8, 9, 12); Nghị định 338/2025/NĐ-CP (Điều 12 đến 17)", "link": "", "tieu_de": "Vay vốn đi làm việc ở nước ngoài theo hợp đồng"}, {"nhom": "Khởi nghiệp", "doi_tuong": "Người lao động là thanh niên.", "noi_dung": "Thanh niên được hỗ trợ lập nghiệp, khởi nghiệp theo quy định của pháp luật. Luật Việc làm nêu nguyên tắc chung; mức hỗ trợ và thủ tục cụ thể thực hiện theo các văn bản pháp luật có liên quan. Liên hệ Chi đoàn hoặc Trung tâm Dịch vụ việc làm để được hướng dẫn.", "dieu_kien": "", "ho_so": "", "noi_nop": "", "can_cu": "Luật Việc làm 74/2025/QH15 (Điều 12)", "link": "", "tieu_de": "Hỗ trợ lập nghiệp, khởi nghiệp cho thanh niên"}, {"nhom": "Đi làm việc ở nước ngoài", "tieu_de": "Quyền lợi khi đi làm việc ở nước ngoài (luật sửa đổi, hiệu lực 01/03/2027)", "doi_tuong": "Người lao động đi làm việc ở nước ngoài theo hợp đồng", "noi_dung": "• Doanh nghiệp chỉ được thu phí đào tạo, ngoại ngữ sau khi người lao động được tuyển chọn\n• Doanh nghiệp phải cam kết bằng văn bản thời gian chờ xuất cảnh tối đa 180 ngày kể từ khi người lao động trúng tuyển; không thực hiện đúng cam kết phải bồi thường, hoàn trả tiền dịch vụ\n• Thu tiền môi giới từ người lao động là hành vi bị cấm đối với doanh nghiệp\n• Không phải đóng bảo hiểm xã hội hoặc thuế thu nhập cá nhân hai lần nếu hai nước có hiệp định tương ứng", "dieu_kien": "", "ho_so": "", "noi_nop": "Luật có hiệu lực từ 01/03/2027. Trước thời điểm này vẫn áp dụng quy định hiện hành.", "can_cu": "Luật 22/2026/QH16 sửa đổi Luật Người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng số 69/2020/QH14", "link": ""}, {"nhom": "Đăng ký lao động", "doi_tuong": "Người lao động đang có việc làm và người thất nghiệp (đang không có việc làm, đang tìm kiếm việc làm và sẵn sàng làm việc).", "noi_dung": "• Người tham gia bảo hiểm xã hội bắt buộc: đăng ký lao động thực hiện cùng khi đăng ký tham gia bảo hiểm xã hội, áp dụng từ 01/7/2026\n• Người có việc làm không thuộc diện bảo hiểm xã hội bắt buộc và người thất nghiệp: tự khai Tờ khai điện tử trực tuyến, áp dụng từ 01/01/2027\n• Người có nhu cầu tìm việc: đăng ký tìm kiếm việc làm trực tiếp tại tổ chức dịch vụ việc làm công hoặc trực tuyến", "dieu_kien": "", "ho_so": "Tờ khai điện tử đăng ký, điều chỉnh thông tin đăng ký lao động (mẫu kèm Nghị định 318/2025/NĐ-CP). Thông tin đã có trong cơ sở dữ liệu quốc gia về dân cư và bảo hiểm sẽ được điền tự động; người lao động chỉ điền phần còn thiếu.", "noi_nop": "Truy cập Sàn giao dịch việc làm quốc gia (www.vieclam.gov.vn) hoặc ứng dụng VNeID, chọn mục đăng ký, điều chỉnh thông tin đăng ký lao động. Hệ thống trả kết quả ngay sau khi hoàn thành tờ khai. Tại Quảng Trị, có thể xem thông tin việc làm tại vieclam.quangtri.gov.vn.", "can_cu": "Luật Việc làm 74/2025/QH15 (Điều 16 đến 18); Nghị định 318/2025/NĐ-CP (Điều 3 đến 7, 25)", "link": "", "tieu_de": "Đăng ký lao động và tìm kiếm việc làm"}, {"nhom": "Bảo hiểm thất nghiệp", "doi_tuong": "Người lao động đang đóng bảo hiểm thất nghiệp bị chấm dứt hợp đồng lao động, hợp đồng làm việc hoặc chấm dứt làm việc và có nhu cầu tìm việc.", "noi_dung": "• Tư vấn, giới thiệu việc làm\n• Trợ cấp thất nghiệp hằng tháng bằng 60% mức bình quân tiền lương tháng đóng bảo hiểm thất nghiệp của 06 tháng gần nhất, tối đa 05 lần mức lương tối thiểu vùng\n• Thời gian hưởng: đóng đủ 12 đến 36 tháng được hưởng 03 tháng; cứ thêm đủ 12 tháng được thêm 01 tháng; tối đa 12 tháng\n• Hỗ trợ đào tạo, nâng cao trình độ kỹ năng nghề: học phí và tiền ăn, tổng thời gian hỗ trợ tối đa 06 tháng\n• Được đóng bảo hiểm y tế trong thời gian hưởng trợ cấp", "dieu_kien": "Hưởng trợ cấp thất nghiệp khi:\n• Chấm dứt hợp đồng đúng quy định, không thuộc trường hợp đơn phương chấm dứt trái pháp luật hoặc nghỉ việc khi đủ điều kiện hưởng lương hưu\n• Đã đóng bảo hiểm thất nghiệp từ đủ 12 tháng trở lên trong 24 tháng trước khi chấm dứt hợp đồng (hợp đồng từ 01 đến dưới 12 tháng: đủ 12 tháng trong 36 tháng)\n• Nộp đủ hồ sơ trong 03 tháng kể từ ngày chấm dứt hợp đồng\nHỗ trợ đào tạo (người không hưởng trợ cấp): đã đóng từ đủ 09 tháng trong 36 tháng trước khi chấm dứt hợp đồng và nộp hồ sơ trong 12 tháng", "ho_so": "", "noi_nop": "Hồ sơ và thủ tục chi tiết theo Nghị định 374/2025/NĐ-CP; liên hệ Trung tâm Dịch vụ việc làm để được hướng dẫn. Thời điểm hưởng trợ cấp là ngày làm việc thứ 11 kể từ ngày nộp đủ hồ sơ. Trong thời gian hưởng, hằng tháng người lao động phải thông báo việc tìm kiếm việc làm.", "can_cu": "Luật Việc làm 74/2025/QH15 (Điều 29 đến 41); Nghị định 374/2025/NĐ-CP", "link": "", "tieu_de": "Trợ cấp thất nghiệp và hỗ trợ khi mất việc làm"}, {"nhom": "Việc làm", "doi_tuong": "Người lao động có nhu cầu tham gia việc làm công; ưu tiên người dân tộc thiểu số, người thuộc hộ nghèo, hộ cận nghèo, người cao tuổi, người khuyết tật và một số đối tượng khác.", "noi_dung": "• Làm việc trong các chương trình, dự án, hoạt động sử dụng vốn nhà nước tại địa phương\n• Người làm đủ 8 giờ/ngày và 26 ngày/tháng được trả tiền công theo tháng, không thấp hơn mức lương tối thiểu vùng\n• Thời giờ làm việc không quá 08 giờ/ngày; mỗi tuần nghỉ ít nhất 01 ngày", "dieu_kien": "", "ho_so": "", "noi_nop": "Đăng ký tham gia với UBND cấp xã nơi ở hiện tại. UBND cấp xã lập danh sách và niêm yết công khai tại trụ sở, nơi sinh hoạt cộng đồng.", "can_cu": "Luật Việc làm 74/2025/QH15 (Điều 11); Nghị định 338/2025/NĐ-CP (Điều 18 đến 24)", "link": "", "tieu_de": "Việc làm công"}],
 docs:[{"ten": "Luật Việc làm số 74/2025/QH15", "loai": "Luật", "so_hieu": "74/2025/QH15", "ngay": "16/06/2025", "tom_tat": "Hỗ trợ tạo việc làm, đăng ký lao động, thị trường lao động, kỹ năng nghề, dịch vụ việc làm, bảo hiểm thất nghiệp. Hiệu lực từ 01/01/2026.", "link_pdf": ""}, {"ten": "Nghị định 318/2025/NĐ-CP – Đăng ký lao động, hệ thống thông tin thị trường lao động", "loai": "Nghị định", "so_hieu": "318/2025/NĐ-CP", "ngay": "12/12/2025", "tom_tat": "Đăng ký, điều chỉnh thông tin đăng ký lao động; cơ sở dữ liệu người lao động. Một số điều áp dụng từ 01/7/2026 và 01/01/2027.", "link_pdf": ""}, {"ten": "Nghị định 338/2025/NĐ-CP – Chính sách hỗ trợ tạo việc làm", "loai": "Nghị định", "so_hieu": "338/2025/NĐ-CP", "ngay": "25/12/2025", "tom_tat": "Cho vay hỗ trợ tạo việc làm, vay đi làm việc ở nước ngoài, việc làm công, hỗ trợ đào tạo nghề, hỗ trợ đi làm việc ở nước ngoài. Hiệu lực từ 01/01/2026.", "link_pdf": ""}, {"ten": "Nghị định 352/2025/NĐ-CP – Dịch vụ việc làm", "loai": "Nghị định", "so_hieu": "352/2025/NĐ-CP", "ngay": "30/12/2025", "tom_tat": "Tổ chức dịch vụ việc làm công, doanh nghiệp dịch vụ việc làm, ký quỹ, Sàn giao dịch việc làm quốc gia; kèm các phiếu đăng ký dịch vụ việc làm.", "link_pdf": ""}, {"ten": "Nghị định 374/2025/NĐ-CP – Bảo hiểm thất nghiệp", "loai": "Nghị định", "so_hieu": "374/2025/NĐ-CP", "ngay": "31/12/2025", "tom_tat": "Hướng dẫn chi tiết chế độ bảo hiểm thất nghiệp: hồ sơ, trình tự, thủ tục.", "link_pdf": ""}, {"ten": "Luật 22/2026/QH16 – Sửa đổi Luật Người lao động Việt Nam đi làm việc ở nước ngoài theo hợp đồng", "loai": "Luật", "so_hieu": "22/2026/QH16", "ngay": "24/08/2026", "tom_tat": "Hiệu lực từ 01/03/2027.", "link_pdf": ""}, {"ten": "Nghị định 372/2025/NĐ-CP – Sửa đổi Nghị định 112/2021/NĐ-CP", "loai": "Nghị định", "so_hieu": "372/2025/NĐ-CP", "ngay": "31/12/2025", "tom_tat": "", "link_pdf": ""}, {"ten": "Thông tư 09/2026/TT-BNV – Sửa đổi Thông tư 21/2021/TT-BLĐTBXH", "loai": "Thông tư", "so_hieu": "09/2026/TT-BNV", "ngay": " const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DATA={},CFG={},LIVE=false,filter="Tất cả",q="";const SRCUSED={};

function parseCSV(t){const rows=[];let r=[],c="",inq=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(inq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else inq=false}else c+=ch}
  else if(ch=='"')inq=true;
  else if(ch==","){r.push(c);c=""}
  else if(ch=="\n"){r.push(c);rows.push(r);r=[];c=""}
  else if(ch!="\r")c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}
 const h=(rows.shift()||[]).map(x=>x.trim().toLowerCase());
 const out=rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()])));out.h=h;return out;}
const REQ={jobs:"tieu_de",abroad:"ten_don_hang",training:"ten_khoa",policies:"tieu_de",docs:"ten",config:"key"};
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const parseD=s=>{s=(s||"").trim();let m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s);if(m)return new Date(+m[3],+m[2]-1,+m[1]);m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const isNew=s=>{const d=parseD(s);return !!d&&d<=TODAY&&(TODAY-d)/864e5<=3};
const expired=x=>{const d=parseD(x.han_nop);return !!d&&d<TODAY};
const FF=p=>p==="abroad"?"thi_truong":p==="policies"?"nhom":"loai";

async function loadTab(name,key){
 let err=new Error(name);
 for(const id of [SHEET_ID,SHEET_FALLBACK].filter(Boolean)){
  try{
   const pub=id.startsWith("2PACX-"),gid=(GIDS[id]||{})[name];if(pub&&!gid)throw new Error(name);
   const u=pub?`https://docs.google.com/spreadsheets/d/e/${id}/pub?gid=${gid}&single=true&output=csv&_=${Date.now()}`
    :`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}&headers=1&_=${Date.now()}`;
   const res=await fetch(u);if(!res.ok)throw new Error(name);
   const rows=parseCSV(await res.text());if(!rows.h.includes(REQ[key]))throw new Error("sai tab "+name);
   SRCUSED[name]=id===SHEET_ID?"nguồn chính":"nguồn dự phòng";
   return rows.filter(r=>!/^(n|no|false|0|ẩn)$/i.test(r.hien_thi||""));
  }catch(e){err=e}
 }
 SRCUSED[name]="LỖI";
 throw err;}

const driveImg=u=>{const m=/\/d\/([\w-]+)|[?&]id=([\w-]+)/.exec(u||"");return m?`https://drive.google.com/thumbnail?id=${m[1]||m[2]}&sz=w400`:u};

async function init(){
 DATA={};LIVE=false;
 if(SHEET_ID){
  const k=Object.keys(TABS);
  const res=await Promise.all(k.map(x=>loadTab(TABS[x],x).catch(()=>null)));
  k.forEach((x,i)=>{if(res[i])DATA[x]=res[i]});
  LIVE=res.slice(0,5).some(Boolean);
 }
 Object.keys(TABS).forEach(k=>{const fb=(k==="policies"||k==="docs");if(!DATA[k]||(LIVE&&fb&&!DATA[k].length))DATA[k]=(LIVE&&!fb&&k!=="config")?[]:SAMPLE[k]});
 CFG={...DEF};(DATA.config||[]).forEach(r=>{if(r.key&&r.value)CFG[r.key.trim().toLowerCase()]=r.value});
 /* Chế độ dữ liệu mẫu (chưa kết nối được bảng tính): hiện ô lịch minh họa để xem giao diện */
 if(!LIVE&&!CFG.san_ngay){const t=new Date(TODAY);t.setDate(t.getDate()+10);CFG.san_ngay=String(t.getDate()).padStart(2,"0")+"/"+String(t.getMonth()+1).padStart(2,"0")+"/"+t.getFullYear();CFG.san_gio="08:00 – 11:30";CFG.san_dia_diem="Trung tâm Dịch vụ việc làm tỉnh Quảng Trị"}
 if(CFG.don_vi)$("#unit").textContent=CFG.don_vi;
 /* Tên trang cố định, không lấy từ bảng tính */
 $("#title").textContent="CẨM NANG VIỆC LÀM DÀNH CHO THANH NIÊN";document.title="CẨM NANG VIỆC LÀM DÀNH CHO THANH NIÊN";
 if(CFG.mo_ta)$("#sub").textContent=CFG.mo_ta;
 setLogo();setBanner();render(true);fitTitle();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTitle);}
addEventListener("resize",()=>fitTitle());

const bigImg=u=>{const m=/\/d\/([\w-]+)|[?&]id=([\w-]+)/.exec(u||"");return m?`https://drive.google.com/thumbnail?id=${m[1]||m[2]}&sz=w1400`:u};
function fitTitle(){const h=$("#title");if(!h||!h.style||typeof h.scrollWidth!=="number")return;let z=44,n=0;h.style.fontSize=z+"px";while(z>13&&h.scrollWidth>h.clientWidth+1&&n++<60){z--;h.style.fontSize=z+"px"}}
function setBg(){const b=document.body;if(!b||!b.style)return;const u=CFG.anh_nen_trang?bigImg(CFG.anh_nen_trang):DEFAULT_BG;b.style.setProperty("--bg-img",u?`url("${u}")`:"none")}
function setBanner(){setBg();const h=$("header");if(!h||!h.style)return;const u=CFG.anh_nen?bigImg(CFG.anh_nen):"";
 if(u){h.style.setProperty("--hd-img",`url("${u}")`);h.classList&&h.classList.add("photo")}
 else{h.style.setProperty("--hd-img",DEFAULT_LOGO?`url("${DEFAULT_LOGO}")`:"none");h.classList&&h.classList.remove("photo")}}
function setLogo(){const s=driveImg(CFG.logo_url)||DEFAULT_LOGO;const l=$("#logo");if(s){l.src=s;l.hidden=false}else l.hidden=true;}

const tel=s=>"tel:"+String(s).replace(/[^\d+]/g,"");
const cur=()=>(location.hash.slice(1)||"home");
function render(top){
 const p=cur();
 $("#nav").innerHTML=PAGES.map(([k,i,l])=>`<a href="#${k}" ${k===p?'aria-current="page"':''}><span>${i}</span>${l}</a>`).join("");
 let h=LIVE?"":`<div class="note">Đang hiển thị dữ liệu mẫu. Dữ liệu thật sẽ hiện sau khi kết nối bảng tính Google Sheets.</div>`;
 if(/[?&]debug/.test(location.search))h+=`<div class="note"><b>Kiểm tra kết nối</b> (bỏ ?debug khỏi địa chỉ để ẩn):<br>${Object.keys(TABS).map(k=>esc(TABS[k])+": "+esc(SRCUSED[TABS[k]]||"chưa đọc")).join("<br>")}</div>`;
 h+=p==="home"?home():list(p);
 h+=`<footer>${esc(CFG.don_vi||"")}</footer>`;
 $("#app").innerHTML=h;
 const s=$("#s");if(s)s.oninput=e=>{q=e.target.value;const pos=q.length;render();const n=$("#s");n.focus();n.setSelectionRange(pos,pos)};
 document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
 if(top)window.scrollTo(0,0);}

const WD=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];
/* Ô lịch Sàn giao dịch việc làm: đọc từ tab Cau_hinh (san_ngay, san_gio, san_dia_diem, san_ten, san_link).
   san_ngay nhập 1 ngày, hoặc nhiều ngày cách nhau dấu ; thì app tự chọn ngày sắp tới gần nhất. */
function cal(){
 const ds=String(CFG.san_ngay||"").split(/[;|\n,]+/).map(parseD).filter(Boolean).sort((a,b)=>a-b);
 if(!ds.length)return "";
 const d=ds.find(x=>x>=TODAY)||ds[ds.length-1];
 const diff=Math.round((d-TODAY)/864e5);
 const st=diff<0?"past":diff===0?"today":diff<=7?"soon":"";
 const bd=diff<0?"Đã diễn ra":diff===0?"HÔM NAY":diff===1?"Ngày mai":"Còn "+diff+" ngày";
 const ten=CFG.san_ten||"Sàn giao dịch việc làm";
 const tag=diff<0?"Phiên gần nhất":"Phiên sắp tới";
 const info=(CFG.san_gio?`<span>⏰ ${esc(CFG.san_gio)}</span>`:"")+(CFG.san_dia_diem?`<span>📍 ${esc(CFG.san_dia_diem)}</span>`:"");
 const body=`<div class="ct">📅 ${esc(ten)}<br>${tag}</div>
  <div class="box"><div class="m">THÁNG ${d.getMonth()+1} · ${d.getFullYear()}</div><div class="d">${String(d.getDate()).padStart(2,"0")}</div><div class="w">${WD[d.getDay()]}</div></div>
  ${info?`<div class="info">${info}</div>`:""}
  <span class="badge2">${bd}</span>${CFG.san_link?`<span class="more">Xem chi tiết ›</span>`:""}`;
 return CFG.san_link?`<a class="tile cal ${st}" href="${esc(CFG.san_link)}" target="_blank" rel="noopener">${body}</a>`:`<div class="tile cal ${st}">${body}</div>`;}

function home(){
 const n=k=>(DATA[k]||[]).length,act=k=>(DATA[k]||[]).filter(x=>!expired(x)).length;
 const H=`<a class="tile hero" href="#jobs"><div class="ic">💼</div><b>${esc(T("jobs"))}</b><span class="s">${act("jobs")} tin đang tuyển</span></a>`,C=cal();
 return `<div class="grid">
 ${C?`<div class="duo">${H}${C}</div>`:H}
 <a class="tile" href="#abroad"><div class="ic">🌏</div><b>${esc(T("abroad"))}</b><span class="s">Đài Loan, Nhật Bản, Hàn Quốc, CHLB Đức · ${act("abroad")} đơn hàng</span></a>
 <a class="tile" href="#training"><div class="ic">🎓</div><b>${esc(T("training"))}</b><span class="s">${n("training")} khóa học</span></a>
 <a class="tile" href="#policies"><div class="ic">📋</div><b>${esc(T("policies"))}</b><span class="s">${n("policies")} chính sách</span></a>
 <a class="tile" href="#docs"><div class="ic">📄</div><b>${esc(T("docs"))}</b><span class="s">${n("docs")} tài liệu</span></a>
 <div class="tile reg"><b style="margin-top:0">${esc(T("reg"))}</b><span class="s">Xem việc làm trong tỉnh, đăng ký lao động và tìm việc qua các kênh sau.</span>
  <div class="row"><a class="btn" href="${esc(CFG.link_website)}" target="_blank" rel="noopener">Website việc làm Quảng Trị</a><a class="btn alt" href="${esc(CFG.link_form)}" target="_blank" rel="noopener">Đăng ký tìm việc làm trực tuyến</a><a class="btn alt" href="${esc(CFG.link_fanpage)}" target="_blank" rel="noopener">Fanpage Sàn giao dịch việc làm</a></div></div>
 <div class="tile contact"><div class="ct"><div class="ic">🌐</div><b>LIÊN HỆ</b></div>
  <div class="row"><a class="btn" href="${esc(CFG.link_snv)}" target="_blank" rel="noopener">Website Sở Nội vụ tỉnh Quảng Trị</a><a class="btn alt" href="${esc(CFG.link_ttdvvl)}" target="_blank" rel="noopener">Website Trung tâm Dịch vụ việc làm</a></div></div>
 </div>`;}

const ready=(a,keys)=>a.filter(r=>!q||keys.some(k=>(r[k]||"").toLowerCase().includes(q.toLowerCase())));
const btn=(u,t)=>u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`:"";
const meta=a=>`<div class="meta">${a.filter(Boolean).map(esc).join(" · ")}</div>`;
const line=(l,v)=>v?`<p class="pl"><b>${l}:</b> ${esc(v)}</p>`:"";
const sec=(l,v)=>v?`<p class="pl"><b>${l}</b>
${esc(v)}</p>`:"";

function list(p){
 if(!DATA[p])return"";
 const rows=DATA[p];
 let out=`<h2>${esc(T(p))}</h2>`;
 if(p==="policies")out+=`<div class="note">Thông tin tóm tắt từ các văn bản đã nêu ở từng mục, mang tính tham khảo. Vui lòng xem văn bản gốc trong mục Tài liệu hoặc liên hệ để được hướng dẫn cụ thể.</div>`;
 if(p==="abroad")out+=`<div class="note">Chỉ đăng ký qua doanh nghiệp được Bộ Nội vụ cấp Giấy phép hoạt động dịch vụ đưa người lao động đi làm việc ở nước ngoài. Cảnh giác với các khoản thu sai quy định. Liên hệ UBND xã, phường, đặc khu hoặc Sở Nội vụ để được tư vấn và hỗ trợ chi phí.</div>`;
 out+=`<div class="bar"><input type="search" id="s" placeholder="Tìm kiếm..." value="${esc(q)}" aria-label="Tìm kiếm">`;
 if(["jobs","docs","abroad","policies"].includes(p)){
  const f=FF(p);
  const base=p==="abroad"?MARKETS:[];
  const opts=["Tất cả",...new Set([...base,...rows.map(r=>r[f]).filter(Boolean)])];
  out+=opts.map(o=>`<button class="chip" data-f="${esc(o)}" aria-pressed="${o===filter}">${esc(o)}</button>`).join("");}
 out+="</div>";
 let r=rows;
 if(p==="jobs"||p==="abroad")r=r.filter(x=>!expired(x));
 if(p==="jobs")r=[...r].sort((a,b)=>(parseD(b.ngay_dang)||0)-(parseD(a.ngay_dang)||0));
 const f=FF(p);
 if(["jobs","docs","abroad","policies"].includes(p))r=r.filter(x=>filter==="Tất cả"||x[f]===filter);
 const keys={jobs:["tieu_de","don_vi","dia_diem","mo_ta","trinh_do"],abroad:["ten_don_hang","nganh_nghe","doanh_nghiep","mo_ta"],training:["ten_khoa","co_so","mo_ta","dia_diem"],policies:["tieu_de","doi_tuong","noi_dung","nhom","dieu_kien","ho_so"],docs:["ten","loai","so_hieu","tom_tat"]}[p];
 r=ready(r,keys);
 if(!r.length)return out+`<div class="empty">Chưa có nội dung phù hợp. Hãy thử từ khóa khác.</div>`;
 const card={
  jobs:x=>`<div class="item">${isNew(x.ngay_dang)?'<span class="badge new">Mới</span>':""}<h3>${esc(x.tieu_de)}</h3>${meta([x.don_vi,x.dia_diem,x.muc_luong,x.so_luong&&"SL: "+x.so_luong,x.han_nop&&"Hạn nộp: "+x.han_nop])}${line("Yêu cầu",x.trinh_do)}${line("Liên hệ",x.lien_he)}${x.mo_ta?`<p class="pl">${esc(x.mo_ta)}</p>`:""}${x.ngay_dang?`<div class="meta" style="margin-top:6px">Đăng ngày ${esc(x.ngay_dang)}</div>`:""}${btn(x.link,"Xem chi tiết")}</div>`,
  abroad:x=>`<div class="item"><span class="badge">${esc(x.thi_truong)}</span><h3>${esc(x.ten_don_hang)}</h3>${meta([x.nganh_nghe,x.so_luong&&"SL: "+x.so_luong,x.gioi_tinh,x.do_tuoi&&"Tuổi: "+x.do_tuoi,x.dia_diem_lam_viec])}${line("Thu nhập",x.muc_luong)}${line("Chi phí dự kiến",x.chi_phi)}${line("Doanh nghiệp",x.doanh_nghiep)}${line("Hạn đăng ký",x.han_nop)}${x.mo_ta?`<p>${esc(x.mo_ta)}</p>`:""}${btn(x.link,"Xem chi tiết / đăng ký")}</div>`,
  training:x=>`<div class="item"><h3>${esc(x.ten_khoa)}</h3>${meta([x.co_so,x.dia_diem,x.thoi_gian,x.khai_giang&&"Khai giảng: "+x.khai_giang])}${line("Học phí",x.hoc_phi)}${line("Hỗ trợ",x.ho_tro)}${x.mo_ta?`<p class="pl">${esc(x.mo_ta)}</p>`:""}${btn(x.link,"Đăng ký / tìm hiểu")}</div>`,
  policies:x=>`<div class="item">${x.nhom?`<span class="badge">${esc(x.nhom)}</span>`:""}<h3>${esc(x.tieu_de)}</h3>${line("Đối tượng",x.doi_tuong)}${x.noi_dung?`<p class="pl">${esc(x.noi_dung)}</p>`:""}${(x.dieu_kien||x.ho_so||x.noi_nop)?`<details><summary>Điều kiện, hồ sơ, nơi nộp</summary>${sec("Điều kiện",x.dieu_kien)}${sec("Hồ sơ",x.ho_so)}${sec("Nơi nộp, thời hạn, lưu ý",x.noi_nop)}</details>`:""}${x.can_cu?`<div class="meta" style="margin-top:8px">Căn cứ: ${esc(x.can_cu)}</div>`:""}${btn(x.link,"Xem thêm")}</div>`,
  docs:x=>`<div class="item"><h3>${esc(x.ten)}</h3>${meta([x.loai,x.so_hieu,x.ngay])}${x.tom_tat?`<p class="pl">${esc(x.tom_tat)}</p>`:""}${btn(x.link_pdf,"Mở / tải PDF")}</div>`}[p];
 return out+r.map(card).join("");}

addEventListener("hashchange",()=>{filter="Tất cả";q="";render(true)});
init();
/* Tự cập nhật khi Google Sheet thay đổi: tải lại định kỳ và khi quay lại tab trình duyệt */let LASTLOAD=Date.now();
const softRefresh=()=>{if(document.hidden||(document.activeElement&&document.activeElement.id==="s"))return;LASTLOAD=Date.now();init(true).catch(()=>{})};
setInterval(softRefresh,REFRESH_MS);document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Date.now()-LASTLOAD>60000)softRefresh()});
</script>
</body>
</html>
